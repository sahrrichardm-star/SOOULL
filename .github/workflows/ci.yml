name: SOOULL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sooull-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-build:
    name: Dependency audit, TypeScript and production smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build and smoke test customer production bundle
        run: npm run build

      - name: Install locked admin dependencies
        run: npm ci --prefix admin-console --no-audit --no-fund

      - name: Build administrator production bundle
        run: npm run build --prefix admin-console
